name: Build InsideOut Infra
run-name: Build InsideOut Infra
on:
  workflow_call:
    inputs:
      ACTION:
        description: "Action"
        type: string
      CLOUD_PROVIDER:
        description: "Cloud Provider"
        type: string
      REGION:
        description: "Region (Location)"
        type: string

jobs:
  build_website:
    name: Build Website
    runs-on: [ubuntu-latest]
    environment: ${{ inputs.CLOUD_PROVIDER }}
    env:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      GH_INSTALLATION_ID: ${{ secrets.GH_INSTALLATION_ID }}
      OWNER_NAME: kgacdevops
    steps:
    - name: Generate GH Token
      uses: kgacdevops/github_automation_scripts/.github/actions/generateGithubToken@main
    
    - name: Checkout Source Code
      uses: actions/checkout@v6
      with:
        repository: kgacdevops/inside_out
        ref: main
        path: project
    
    - name: Checkout Terraform Repository
      uses: actions/checkout@v6
      with:
        repository: kgacdevops/iac_terraform
        ref: main
        path: iac
    
    - name: Package Lambda Code
      shell: bash
      run: |
        cd project/lambda
        zip ${{ github.workspace }}/iac/insideout_infra/aws/modules/backend/backend_api.zip query_verse.py
        zip ${{ github.workspace }}/iac/insideout_infra/aws/modules/backend/load_items_db.zip load_items_db.py
        ls -l ${{ github.workspace }}/iac/insideout_infra/aws

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        role-to-assume: ${{ secrets.GH_AWS_IAM_ROLE }}
        aws-region: ${{ inputs.REGION }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ vars.TERRAFORM_VERSION }}

    - name: Setup TF Vars
      run: |
        cd iac/insideout_infra/${{ inputs.CLOUD_PROVIDER }}
        sed -i 's/{REGION}/${{ inputs.REGION }}/g' terraform.tfvars
        sed -i 's/{LAMBDA_PY_VERSION}/${{ vars.LAMBDA_PY_VERSION }}/g' terraform.tfvars
        sed -i 's/{BUCKET_NAME}/${{ vars.SITE_DOMAIN }}/g' terraform.tfvars
        sed -i 's/{PREFIX}/${{ vars.PREFIX }}/g' terraform.tfvars
        cat terraform.tfvars

        sed -i 's/{REGION}/${{ inputs.REGION }}/g' backend.tf
        sed -i 's/{TFSTATE_BUCKET_NAME}/${{ vars.TFSTATE_BUCKET_NAME }}/g' backend.tf
        cat backend.tf
    
    - name: Run Terraform
      shell: bash
      run: |
        cd iac/insideout_infra/${{ inputs.CLOUD_PROVIDER }}
        terraform init
        terraform plan
        if [[ "${{ inputs.ACTION }}" == "apply" ]]; then
          terraform apply -auto-approve
        elif [[ "${{ inputs.ACTION }}" == "destroy" ]]; then
          terraform destroy -auto-approve
        fi
    
    - name: Get Endpoints
      id: url
      if: inputs.ACTION == 'apply'
      run: |
        api_endpoint=$(cat ${{ github.workspace }}/iac/insideout_infra/aws/backend_api_endpoint.txt)
        website_endpoint=$(cat ${{ github.workspace }}/iac/insideout_infra/aws/website_endpoint.txt)
        echo "api_endpoint=$api_endpoint" >> $GITHUB_OUTPUT
        echo "website_endpoint=$website_endpoint" >> $GITHUB_OUTPUT
    
    - name: Post Provision
      if: inputs.ACTION == 'apply'
      env:
        LOAD_ITEMS_LAMBDA_FUNCTION: "${{ vars.PREFIX }}-load-db-items"
      run: |
        echo "Sync S3.."
        cd ${{ github.workspace }}/project/frontend
        sed -i "s|{BACKEND_API_ENDPOINT}|${{ steps.url.outputs.api_endpoint }}|g" index.html
        aws s3 sync . s3://${{ vars.SITE_DOMAIN }} --delete

        echo "Loading DynamoDB Table.."
        aws lambda invoke --function-name ${{ env.LOAD_ITEMS_LAMBDA_FUNCTION }} --cli-binary-format raw-in-base64-out response.json
    
    - name: Display Endpoints
      if: inputs.ACTION == 'apply'
      uses: actions/github-script@v9
      with:
        script: |
          core.notice("Website URL: http://${{ steps.url.outputs.website_endpoint }}")